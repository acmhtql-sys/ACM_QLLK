name: Stage4C global PREPARE port (OFFLINE / NO DB)
on:
  push:
    branches:
      - review/stage4c-global-prepare-writer-20261030
    paths:
      - apps/api/src/modules/borrow/borrow.return-prepare.contract.ts
      - apps/api/src/modules/borrow/borrow.return-writer.contract.ts
      - apps/api/src/modules/borrow/borrow.return-policy.ts
      - scripts/stage4c-return-prepare.offline.mjs
      - scripts/stage4c-return-writer.offline.mjs
      - .github/workflows/stage4c-global-prepare-review-only.yml
  pull_request:
    paths:
      - apps/api/src/modules/borrow/borrow.return-prepare.contract.ts
      - scripts/stage4c-return-prepare.offline.mjs
      - .github/workflows/stage4c-global-prepare-review-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      ACM_RETURN_OPERATIONS_ENABLED: 'false'
      ACM_UI_LIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies without running scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strictly typecheck Stage4C pure port contracts
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --esModuleInterop --skipLibCheck --types node apps/api/src/modules/borrow/borrow.return-policy.ts apps/api/src/modules/borrow/borrow.return-writer.contract.ts apps/api/src/modules/borrow/borrow.return-prepare.contract.ts
      - name: Run only offline Node mock policy and transactional PREPARE tests
        run: node --experimental-strip-types --test scripts/stage4c-return-policy.offline.mjs scripts/stage4c-return-workflow.offline.mjs scripts/stage4c-owner-decisions.offline.mjs scripts/stage4c-return-writer.offline.mjs scripts/stage4c-return-prepare.offline.mjs
