name: Stage4C writer port OFFLINE (no DB)
on:
  push:
    branches:
      - review/stage4c-transactional-writer-port-20261030
    paths:
      - apps/api/src/modules/borrow/borrow.return-policy.ts
      - apps/api/src/modules/borrow/borrow.return-writer.contract.ts
      - scripts/stage4c-return-writer.offline.mjs
      - .github/workflows/stage4c-writer-port-review-only.yml
  pull_request:
    paths:
      - apps/api/src/modules/borrow/borrow.return-policy.ts
      - apps/api/src/modules/borrow/borrow.return-writer.contract.ts
      - scripts/stage4c-return-writer.offline.mjs
      - .github/workflows/stage4c-writer-port-review-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-port-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      ACM_UI_LIVE: 'false'
      ACM_RETURN_OPERATIONS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked deps without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck transaction contract and pure policy only
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --esModuleInterop --skipLibCheck --types node apps/api/src/modules/borrow/borrow.return-writer.contract.ts apps/api/src/modules/borrow/borrow.return-policy.ts
      - name: Run legacy pure tests and new mock transaction adapter checks
        run: node --experimental-strip-types --test scripts/stage4c-return-policy.offline.mjs scripts/stage4c-return-workflow.offline.mjs scripts/stage4c-owner-decisions.offline.mjs scripts/stage4c-return-writer.offline.mjs
