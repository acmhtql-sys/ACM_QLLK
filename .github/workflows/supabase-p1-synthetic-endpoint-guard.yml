# SB-P1: synthetic-only tests; never read secrets, execute SQL or contact Supabase.
name: ACM Supabase P1 URL Guard (Synthetic Only)
on:
  push:
    branches:
      - review/d8-supabase-p0-plan-no-db-20261029

permissions:
  contents: read

jobs:
  synthetic-endpoint-policy:
    name: 21 static URL vectors (NO DB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no Supabase candidates/keys injected
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ACM_SUPABASE_CANDIDATE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${SHADOW_DATABASE_URL:-}"
          echo "PASS SBP1_NO_CONNECTION_SECRETS_IN_CI"
      - name: Check script syntax
        run: node --check scripts/d8-supabase-p1-url-guard.cjs
      - name: Test all synthetic endpoint shapes
        run: node --test scripts/d8-supabase-p1-url-guard.test.cjs
      - name: Verify no tracked-file modifications
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PASS SBP1_NO_TRACKED_WRITES"
