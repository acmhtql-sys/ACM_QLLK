name: ACM CI Pipeline

on:
  push:
    branches: [main, master, develop, 'codex/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  ci-pipeline:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acm_user
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: acm_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_test?schema=public"
      SHADOW_DATABASE_URL: "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_shadow?schema=public"
      JWT_SECRET: ci-pipeline-test-jwt-secret-not-for-production-2026
      JWT_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 10
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # Workspace consumers resolve @acm/shared through packages/shared/dist.
      # Compile it before TypeScript checks the API and Web workspaces.
      - name: Build Shared Workspace
        run: npm run build:shared

      - name: Typecheck Monorepo
        run: npm run typecheck

      - name: Lint Codebase
        run: npm run lint

      - name: Build All Workspaces
        run: npm run build

      # env.ts intentionally refuses to run tests without an isolated .env.test.
      # Create it only inside the ephemeral CI runner, never commit it or reuse cloud credentials.
      - name: Create isolated test environment
        shell: bash
        run: |
          test "$NODE_ENV" = "test"
          test "$DATABASE_URL" = "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_test?schema=public"
          (umask 077; cat > apps/api/.env.test <<'EOF'
          NODE_ENV=test
          PORT=5000
          API_PREFIX=/api/v1
          CORS_ORIGIN=http://localhost:5173
          DATABASE_URL=postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_test?schema=public
          SHADOW_DATABASE_URL=postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_shadow?schema=public
          JWT_SECRET=ci-pipeline-test-jwt-secret-not-for-production-2026
          JWT_EXPIRES_IN=1d
          BCRYPT_SALT_ROUNDS=10
          LOG_LEVEL=debug
          ACM_DEPLOYMENT_PROFILE=local_dev
          STAGING_READ_ONLY=false
          ALLOW_STAGING_AUTH_LOGIN=false
          EOF
          )

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Apply Migrations to CI Test Database
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run Integration & E2E Tests
        run: npm run test:integration
