name: ACM CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'codex/**'

jobs:
  ci-pipeline:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acm_user
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: acm_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acm_user -d acm_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      NODE_ENV: test
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_test?schema=public"
      SHADOW_DATABASE_URL: "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_shadow?schema=public"
      JWT_SECRET: ci-pipeline-test-jwt-secret-not-for-production-2026
      JWT_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 10
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build Shared Package
        run: npm run build:shared

      - name: Typecheck Monorepo
        run: npm run typecheck

      - name: Lint Codebase
        run: npm run lint

      - name: Build All Workspaces
        run: npm run build

      # The RC5 AUTH-LASTADMIN-06 safety test uses a live Prisma
      # transaction despite its unit label. Prepare the ephemeral CI DB
      # first instead of silently weakening that negative assertion.
      - name: Apply Migrations to CI Test Database
        run: npm run prisma:migrate:test

      - name: Seed CI Test Database
        run: npm run prisma:seed:test

      - name: Run All RC5 Unit Tests with CI Database Ready
        run: npm run test:unit

      - name: Run PostgreSQL Integration Tests
        run: npm run test:integration



