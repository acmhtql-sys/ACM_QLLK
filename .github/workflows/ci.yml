name: ACM CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'codex/**'

jobs:
  ci-pipeline:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acm_user
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: acm_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acm_user -d acm_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      NODE_ENV: test
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_test?schema=public"
      SHADOW_DATABASE_URL: "postgresql://acm_user:test_password_ci@127.0.0.1:5432/acm_inventory_shadow?schema=public"
      JWT_SECRET: ci-pipeline-test-jwt-secret-not-for-production-2026
      JWT_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 10
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency advisories (P3-F report only)
        # Inventory only: never auto-fix / update lockfile / mutate dependencies.
        # Findings remain independent release blockers even when this reporting step succeeds.
        run: |
          npm audit --json > "$RUNNER_TEMP/acm-audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/acm-audit-prod.json" || true
          node -e 'const fs=require("fs"); for(const [scope,file] of [["all","acm-audit-all.json"],["production","acm-audit-prod.json"]]){ try{const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/"+file,"utf8")); const counts=report.metadata?.vulnerabilities||{}; const vulns=report.vulnerabilities||{}; const high=Object.entries(vulns).filter(([,v])=>["critical","high"].includes(v.severity)).map(([name,v])=>name+"("+v.severity+")"); const summary="P3F "+scope+" npm audit "+JSON.stringify(counts)+" | HIGH/CRITICAL: "+(high.join(", ")||"none"); console.log(summary); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### "+scope+" npm audit\\n\\n"+summary+"\\n\\n"); }catch(e){console.log("P3F "+scope+" audit unavailable: "+String(e.message));}}'

      - name: Record remaining npm advisory inventory (read only)
        # No dependency mutation, auto-fix, secret reads or deployment.
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const base=process.env.RUNNER_TEMP;
          const scopes=[['all','acm-audit-all.json'],['production','acm-audit-prod.json']];
          for (const [scope,filename] of scopes) {
            try {
              const audit=JSON.parse(fs.readFileSync(base+'/'+filename,'utf8'));
              const inventory=Object.entries(audit.vulnerabilities||{}).map(([name,v])=>({
                name,
                severity:v.severity,
                direct:!!v.isDirect,
                range:v.range,
                fixAvailable:v.fixAvailable===false?'no':v.fixAvailable===true?'yes':'major-or-specific',
                via:(v.via||[]).map(a=>typeof a==='string'?a:a.name).slice(0,5)
              })).sort((a,b)=>a.name.localeCompare(b.name));
              console.log('P3H_ADVISORY_INVENTORY_'+scope.toUpperCase(),JSON.stringify(inventory));
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '### P3-H remaining advisories ('+scope+')\\n\\n'+
                '| Package | Severity | Direct | Fix |\\n|---|---|---|---|\\n'+
                inventory.map(v=>'| '+v.name+' | '+v.severity+' | '+v.direct+' | '+v.fixAvailable+' |').join('\\n')+'\\n\\n');
            }catch(error){console.log('P3H_AUDIT_REPORT_UNAVAILABLE_'+scope,String(error.message));}
          }
          NODE

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build Shared Package
        run: npm run build:shared

      - name: Typecheck Monorepo
        run: npm run typecheck

      - name: Lint Codebase
        run: npm run lint

      - name: Build All Workspaces
        run: npm run build

      - name: Run Mock Unit Tests (Zero DB)
        run: npm run test:unit

      - name: Apply Migrations to CI Test Database
        run: npm run prisma:migrate:test

      - name: Seed CI Test Database
        run: npm run prisma:seed:test

      - name: Run PostgreSQL Integration Tests
        run: npm run test:integration

      - name: Verify live staging read-only guard (P3-F)
        # Only PR #39 head branch runs public, safe negative probes.
        # Uses a nonexistent endpoint for all mutation methods; no credentials or real DB writes.
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/p3-staging-readonly-deployment-20261107'
        run: node scripts/p3f-live-readonly-acceptance.mjs



